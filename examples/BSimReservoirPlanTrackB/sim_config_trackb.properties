# Track B common production template. Run from this directory.
# Frozen Stage 6 kinetics. Do not retune K, n, tau, ALPHA_LUX, DELTA_LUX,
# AHL source, acid source, K_MAX, GROWTH_RATE, or PROD_RATE.
dt=0.05
grid.x=50
grid.y=25
grid.z=1
readout.grid.x=20
readout.grid.y=10
readout.grid.z=1
readout.countgrid.x=4
readout.countgrid.y=2
readout.countgrid.z=1
warmup.s=18000
warmup.ahl.input=0.5
window.duration.s=300
pulse.duration.s=75
sampling.duration.s=300
sampling.interval.s=20
num.windows=200
initial.pop=1800
carrying.capacity=2000
field.att.diff=100.0
field.rep.diff=100.0
field.ahl.diff=159.0
field.acid.diff=200.0
field.att.decay=0.0067
field.rep.decay=0.033
field.ahl.decay=0.0033
field.acid.decay=0.0067
field.ahl.source.rate=128000000
field.acid.source.rate=200000000000
field.acid.cell.production.rate=1000000
field.acid.kmax=0.002
luminescence.alpha=0.000666666666667
input.ahl.file=input_ahl_trackb200.txt
input.acid.file=input_acid_trackb200.txt
input.atta.file=input_atta_trackb200.txt
input.attb.file=input_attb_trackb200.txt
input.rep.file=input_rep_trackb200.txt
headless=true
arm=driven
rng.seed=101
output.write.samples=true
output.write.voxels=true
output.run.label=trackb_driven
output.stochastic.replicate=driven_seed101
output.dir=results/trackb_driven_seed101
