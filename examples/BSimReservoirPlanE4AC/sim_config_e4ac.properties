# E4.1 A1 common production template. Run from this directory.
# Frozen Narma10b claim dish. Do not retune K, n, tau, clamp, mortality,
# flow, or layout. FLOW_SPEED is compile-time 0. A1 Jmax is payload-matched
# and frozen; do not fit K_AC or Jmax to NRMSE. Not a digital twin.
dt=0.05
grid.x=50
grid.y=25
grid.z=1
