# Sweep E0.3 common production template. Copied from SweepS5 / Narma10b.
# Frozen claim dish. Do not retune K, n, tau_R, tau_L, AHL rate, acid rate,
# box, or GROWTH_RATE. This scout only changes AHL x among {200,500,800}
# and flow.speed.um_s among {0, 0.25, 0.5, 0.666667, 1.0}.
# FLOW>0: SweepS5 Stage 6 upwind OUTFLOW. FLOW=0: no chemical advect, NO_FLUX.
# Do not rerun 8 um/s. Readout stays 20x10 + 4x2.
dt=0.05
bound.x=1000
bound.y=500
bound.z=10
grid.x=50
grid.y=25
grid.z=1
readout.grid.x=20
readout.grid.y=10
readout.grid.z=1
readout.countgrid.x=4
readout.countgrid.y=2
readout.countgrid.z=1
warmup.s=18000
warmup.ahl.input=0.5
window.duration.s=300
pulse.duration.s=75
sampling.duration.s=300
sampling.interval.s=20
num.windows=200
initial.pop=1800
carrying.capacity=2000
field.att.diff=100.0
field.rep.diff=100.0
field.ahl.diff=159.0
field.acid.diff=200.0
field.att.decay=0.0067
field.rep.decay=0.033
field.ahl.decay=0.0033
field.acid.decay=0.0067
field.ahl.source.rate=128000000
field.ahl.source.x=500
field.ahl.source.y=250
field.ahl.source.z=5
field.acid.source.rate=200000000000
field.acid.source.x=300
field.acid.source.y=375
field.acid.source.z=5
field.att0.x=250
field.att0.y=250
field.att0.z=5
field.att2.x=750
field.att2.y=250
field.att2.z=5
field.acid.cell.production.rate=1000000
field.acid.kmax=0.002
luminescence.alpha=0.000666666666667
luminescence.delta=0.000666666666667
flow.speed.um_s=0
input.ahl.file=input_ahl_narma200.txt
input.acid.file=input_acid_held05_200.txt
headless=true
arm=driven
rng.seed=111
output.write.samples=true
output.write.voxels=true
output.run.label=narma10b_driven
output.stochastic.replicate=driven_seed111
output.dir=results/narma10b_driven_seed111
