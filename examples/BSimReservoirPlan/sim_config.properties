# Plan Stage 2 production configuration.
dt=0.05
grid.x=50
grid.y=25
grid.z=1

readout.grid.x=20
readout.grid.y=10
readout.grid.z=1
readout.countgrid.x=4
readout.countgrid.y=2
readout.countgrid.z=1

warmup.s=18000
window.duration.s=300
pulse.duration.s=75
sampling.duration.s=300
sampling.interval.s=20
num.windows=40

# Stage10 has fixed 30-minute growth and a K=2000 homeostatic clamp.
# Start high and retain the extended warm-up so the clamp is demonstrably holding.
initial.pop=1800
carrying.capacity=2000

field.att.diff=100.0
field.rep.diff=100.0
field.ahl.diff=159.0
field.att.decay=0.0067
field.rep.decay=0.033
field.ahl.decay=0.0033

headless=true
rng.seed=11
output.dir=results
