# Stage 2 nutrient AC: mix glucose + tau~window + G0 compensation + Model A dose.
# tau300 (D=100, k=0.0033, G0=20) crashed: no-uptake G_eq=k_s*G0/(k_s+k)=4.7 < K_G.
# D=800 → plume ~490 um (dish-scale). G0=73.5 keeps G_eq=17.1 at k_s=0.001, k=0.0033.
# CS_max=1e6, k_refill=1 → I_pulse~1e6 qty/s (Model A max at this G0 is ~3.7e5).
# input_AC3 remapped to AC0 amplitude so ODE gate is not saturated.
# Attractant gamma stays 1x. K_G=KM=5.
dt=0.05
grid.x=50
grid.y=25
warmup.s=9000
window.duration.s=300
pulse.duration.s=75
sampling.duration.s=300
sampling.interval.s=20
num.windows=40
initial.pop=850
carrying.capacity=2000
headless=true

ac.gamma=1.5e6
ac.csmax=5e5
ac.km=5e4
ac.nutrient.gamma=1.5e6
ac.nutrient.csmax=1e6
ac.nutrient.k_refill=1.0

k.g=5.0
km.uptake=5.0

readout.grid.x=20
readout.grid.y=10
readout.grid.z=1
readout.countgrid.x=4
readout.countgrid.y=2
readout.countgrid.z=1

field.glu.diff=800.0
field.glu.decay=0.0033
field.glu.g0=73.5
field.glu.k_supply=0.001
flow.speed=0.0
record_wall_time=true
output.dir=results/nutrient_ac_mixed
