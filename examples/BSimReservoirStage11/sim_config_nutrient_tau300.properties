# Stage 2 nutrient AC, glucose tau ~ window (300 s) so births can track u at lag 0.
# The 6000 s glu decay (results/nutrient_ac) integrated u into a DC offset (N 840->945)
# and left r(births,AC3)~0. Stage 7 slow-glucose memory is deferred.
dt=0.05
grid.x=50
grid.y=25
warmup.s=9000
window.duration.s=300
pulse.duration.s=75
sampling.duration.s=300
sampling.interval.s=20
num.windows=40
initial.pop=850
carrying.capacity=2000
headless=true

ac.gamma=1.5e6
ac.csmax=5e5
ac.km=5e4
ac.nutrient.gamma=1.5e6
ac.nutrient.csmax=5e5

k.g=5.0
km.uptake=5.0

readout.grid.x=20
readout.grid.y=10
readout.grid.z=1
readout.countgrid.x=4
readout.countgrid.y=2
readout.countgrid.z=1

field.glu.diff=100.0
field.glu.decay=0.0033
flow.speed=0.0
record_wall_time=true
output.dir=results/nutrient_ac_tau300
