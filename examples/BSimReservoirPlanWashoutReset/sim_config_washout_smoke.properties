config.include=sim_config_washout.properties
# SMOKE only. 2 load / 2 wash at 8 um/s / 2 post. Not residual evidence.
washout.smoke.not.evidence=true
warmup.s=20
window.duration.s=40
pulse.duration.s=10
sampling.duration.s=40
sampling.interval.s=10
num.windows=6
epoch.load.last.window=1
epoch.wash.last.window=3
load.ahl.u=0.5
load.acid.u=0.5
wash.flow.speed.um_s=8
initial.pop=80
carrying.capacity=2000
arm=driven
rng.seed=101
condition.id=WASH_SMOKE
output.run.label=washout_smoke
output.stochastic.replicate=smoke
output.dir=results/washout_smoke
